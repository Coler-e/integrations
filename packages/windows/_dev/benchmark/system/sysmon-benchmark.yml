---
# End-to-end benchmark for Windows Sysmon-style events via the real Windows Event Log.
#
# Pre-requisite: run push_windows_events.py on the Windows host BEFORE or
# concurrently with this benchmark so that events are flowing into the
# Application channel.  The script writes synthetic Sysmon-style events
# (process create/1, network connect/3, file create/11, DNS query/22).
#
#   pip install pywin32
#   python push_windows_events.py --count 200000 --type sysmon --workers 4
#
# The agent's winlog input reads those events from the Application channel,
# pushing them through the full ingest pipeline to Elasticsearch.
description: Benchmark Windows Sysmon-style events through the full agent pipeline (Application channel)
input: winlog
data_stream:
  name: forwarded
  vars:
    channel: Application
    preserve_original_event: false
    ignore_older: 2h
warmup_time_period: 15s
benchmark_time_period: 120s
