---
# Requires Elastic Agent running on a Windows host with Sysmon installed and
# configured to forward events to the ForwardedEvents channel via WEF.
# Sysmon event IDs: Process Create (1), Network Connect (3), Process Terminate (5),
# Image Load (7), Create Remote Thread (8), Process Access (10), File Create (11),
# Registry Events (12/13/14), File Create Stream Hash (15), Pipe Events (17/18),
# DNS Query (22). High-cardinality field mix stresses pipeline and mapping throughput.
description: Benchmark Windows Sysmon forwarded events through the full agent pipeline
input: winlog
data_stream:
  name: forwarded
  vars:
    event_id: "1,3,5,7,8,10,11,12,13,14,15,17,18,22,23,25"
    preserve_original_event: false
    ignore_older: 1h
warmup_time_period: 30s
benchmark_time_period: 120s
