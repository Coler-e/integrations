---
description: Benchmark 100000 fortinet_fortigate UTM/webfilter log events ingested end-to-end via Elastic Agent
input: logfile
data_stream:
  name: log
  vars:
    paths:
      - "{{SERVICE_LOGS_DIR}}/corpus-*"
    preserve_original_event: false
warmup_time_period: 10s
corpora:
  generator:
    total_events: 100000
    template:
      path: ./webfilter-benchmark/gotext.tpl
      type: gotext
    config:
      path: ./webfilter-benchmark/config.yml
    fields:
      path: ./webfilter-benchmark/fields.yml
